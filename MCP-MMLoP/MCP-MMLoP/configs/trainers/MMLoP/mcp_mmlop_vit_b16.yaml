# =============================================================================
# MCP-MMLoP: Multi-Center Prototype enhanced Multimodal Low-Rank Prompting
# Paper-faithful configuration for the PRPD dataset (paper Table 4 / Sec. 4.2)
#
# Backbone : frozen CLIP ViT-B/16
# Prompting: rank-1 low-rank factors, 4 tokens x 9 layers, shared U (MMLoP)
# MCP       : K=3 sub-prototypes per class, beta=0.5 dual-path fusion
# Training  : AdamW, lr=1e-3, cosine schedule, weight decay 5e-4,
#             batch size 32, 100 epochs, mixed precision (AMP)
# Augmentation: resize 224x224 + brightness jitter + Gaussian noise (sigma=0.01)
#             + rotation <= 5 deg; horizontal/vertical flipping is DISABLED
#             because the phase-angle axis is physically directional.
#
# Note: the EMA update coefficient in code is alpha = 1 - eta. Paper eta=0.99
#       therefore corresponds to EMA_MOMENTUM = 0.01 below.
# =============================================================================
DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  # No "random_flip" (paper Sec. 4.2: flipping disabled for PRPD patterns).
  # No random crop: patterns are resized to 224x224.
  TRANSFORMS: ["colorjitter", "random_rotation", "gaussian_noise", "normalize"]
  COLORJITTER_B: 0.1          # mild brightness jitter only
  COLORJITTER_C: 0.0
  COLORJITTER_S: 0.0
  COLORJITTER_H: 0.0
  GN_MEAN: 0.0
  GN_STD: 0.01                # Gaussian noise sigma <= 0.01

OPTIM:
  NAME: "adamw"
  LR: 0.001
  MAX_EPOCH: 100
  WEIGHT_DECAY: 0.0005
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1.0e-5

TRAIN:
  PRINT_FREQ: 20

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  MMLOP:
    PREC: "amp"
    # ---- Low-rank multimodal prompting (paper Sec. 3.2, Eq. 1) ----
    N_CTX_TEXT: 4
    N_CTX_VISION: 4
    PROMPT_DEPTH_TEXT: 9
    PROMPT_DEPTH_VISION: 9
    PROMPT_START_TEXT: 0
    PROMPT_START_VISION: 0
    LORA_RANK: 1
    SHARED_U: True
    INIT_STD: 0.05
    USE_CTX_INIT_EMBED: True
    CTX_INIT_PHRASE: "a photo of a"
    # ---- SCL loss + UDC (paper Sec. 3.3, Eq. 3 & Eq. 16) ----
    USE_SCL_LOSS: True
    SCL_LOGIT_LOSS: "js"
    TEXT_LOSS_WEIGHT: 25.0     # lambda_1
    IMAGE_LOSS_WEIGHT: 10.0    # lambda_2
    USE_UDC: True
    SINGLE_TEMPLATE: True
    TEXT_TEMPLATE: "a photo of a {}."
    # ---- Multi-Center Prototypes (paper Sec. 3.4-3.7) ----
    USE_MCP: True
    NUM_CENTERS: 3             # K
    PROTO_TEMP: 0.07           # tau (used for prototype-path entropy weights)
    EMA_MOMENTUM: 0.01         # alpha = 1 - eta; eta = 0.99 (paper Eq. 10)
    PROTO_FUSION_WEIGHT: 0.5   # beta (paper Eq. 13)
    INTRA_LOSS_WEIGHT: 5.0     # lambda_intra (paper Eq. 11)
    INTER_LOSS_WEIGHT: 5.0     # lambda_inter (paper Eq. 12)
    INTER_MARGIN: 0.2          # m
